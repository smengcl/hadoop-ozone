# Replaces HBase's conf/log4j2.properties: console only (docker logs), plus TRACE for the Ozone file system
# classes so every FileSystem call HBase makes (recoverLease, isFileClosed, append, hsync, ...) shows up in the log.
status = warn
name = PropertiesConfig

appender.console.type = Console
appender.console.target = SYSTEM_ERR
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{ISO8601} %-5p [%t] %c{2}: %.1000m%n

rootLogger = INFO,console

logger.ozonefs.name = org.apache.hadoop.fs.ozone
logger.ozonefs.level = TRACE

logger.leaserecovery.name = org.apache.hadoop.hbase.util.RecoverLeaseFSUtils
logger.leaserecovery.level = DEBUG

logger.ozoneutils.name = org.apache.hadoop.ozone.om.helpers.OzoneFSUtils
logger.ozoneutils.level = DEBUG
